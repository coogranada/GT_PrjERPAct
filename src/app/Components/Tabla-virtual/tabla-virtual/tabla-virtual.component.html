<div class="scroll-container table-responsive scrollTabla" #scrollContent (scroll)="onScroll($event)">

  <table class="table table-hover" id="tablaDatos">
    <thead>
      <tr>
        <th *ngFor="let col of columnas" (click)="ordenarPor(col)" style="cursor: pointer; text-align: center;">
          {{ col.endsWith('_M') ? col.slice(0, -2) : col }}
          <span *ngIf="columnaOrden === col">
            {{ ordenAscendente ? '↑' : '↓' }}
          </span>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let fila of filasVisibles" (click)="onClickFila(fila)"
        [class.selected-row]="getRowId(fila) === filaSeleccionadaData">
        <td *ngFor="let col of columnas" [ngClass]="{'alinear-derecha': col?.endsWith('_M')}">
          {{ getValor(fila, col) }}
        </td>
      </tr>
      <tr *ngIf="filasVisibles.length < datos.length">
        <td [attr.colspan]="columnas.length" class="text-center">
          Cargando más registros...
        </td>
      </tr>
    </tbody>
    
    <tfoot class="total-tfoot" *ngIf="mostrarTotal">
      <tr>
        <td *ngFor="let col of columnas" [ngClass]="{'alinear-derecha': col?.endsWith('_M')}"  style="font-weight: bold;">
          <ng-container *ngIf="col.endsWith('_M'); else noTotal">
            {{ formatear ? formatear(totales[col], col) : (totales[col] | number:'1.2-2') }}
          </ng-container>
          <ng-template #noTotal class="text-center">
            {{ col === columnas[0] ? 'Total registros: ' + (datos.length || 0) : '' }}
          </ng-template>
        </td>
      </tr>
    </tfoot>

  </table>
  <div class="col-md-12 col-lg-12 col-sm-12 text-right" *ngIf="mostrarBtnCopia">
    <button class="btn btn-secondary btn-sm" (click)="copiarTabla()">copiar</button>
  </div>
</div>
