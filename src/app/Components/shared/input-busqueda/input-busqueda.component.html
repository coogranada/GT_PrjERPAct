<div class="col-xs-12 col-lg-4">

    <div>
        <label class="textNegrilla">
            {{ label() }}:
        </label>
        @if (requerido()) {
            <span class="text-danger">*</span>
        }
    </div>

    <div class="row">
        <div [class]="'col-xs-' + colCodigo() + ' col-lg-' + colCodigo()">
            <input
                type="text"
                class="form-control"
                [formControl]="codigoControl()"
                (blur)="buscarPorCodigo()"
                (input)="onCodigoInput()"
                maxlength="5">

        </div>

        <div [class]="'col-xs-' + colDescripcion() + ' col-lg-' + colDescripcion()">
            <input type="text" class="form-control pmayuscula" [formControl]="descripcionControl()" (input)="onDescripcionInput()" maxlength="100">
        </div>
        <div [class]="'col-xs-' + colBoton() + ' col-lg-' + colBoton()">
            <button
                type="button"
                class="btn Gt-btn-verde btn-icon"
                [disabled]="disabled()"
                (click)="buscarPorDescripcion()">
                <i class="icon-search4"></i>
            </button>
        </div>
    </div>
    <div #modal class="modal fade">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-morado">
                    <button type="button" class="close" data-dismiss="modal">
                        &times;
                    </button>
                    <h6 class="modal-title">
                        {{ titulo() }}
                    </h6>
                </div>
                <div class="modal-body">
                    <div class="table-responsive scrollTabla">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    @for (column of columns(); track column.field) {
                                        <th>
                                            <strong>{{ column.header }}</strong>
                                        </th>
                                    }
                                </tr>
                            </thead>
                            <tbody>
                                @for (item of items; track $index) {
                                    <tr (click)="seleccionar(item)">
                                        @for (column of columns(); track column.field) {
                                            <td>
                                                {{ obtenerValor(item, column.field) }}
                                            </td>
                                        }
                                    </tr>
                                }
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn Gt-btn-morado" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>
