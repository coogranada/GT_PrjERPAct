<div class="panel panel-white">
    <div class="panel-heading doNotPrint">
        <h6 class="panel-title">Búsqueda</h6>
        <div class="heading-elements">
            <ul class="icons-list">
                <li>
                    <a data-toggle="modal" data-target="#ModalAyuda">
                        <i class="icon-question6 " title="Ayuda" data-popup="tooltip" data-trigger="hover"
                            data-placement="top"></i>
                    </a>
                </li>
                <li>
                    <a data-action="collapse"></a>
                </li>
            </ul>
        </div>
    </div>
    <div class="panel-body doNotPrint">
        <div class="col-xs-12 col-md-12 col-lg-12">
            <div class="panel panel-white">
                <div>
                    <div>
                        <div class="col-md-3 text-center">
                            <div class="row">
                                <div class="col-xs-7">
                                    <label class="radio-custom">
                                        <input type="radio" class="radioB" name="tipoTransaccion" value="0"
                                            (click)="seleccionBusqueda(true)" #RadioBTransaccion>
                                        <span>Transacción</span>
                                    </label>
                                </div>

                                <div class="col-xs-5">
                                    <label class="radio-custom">
                                        <input type="radio" class="radioB" name="tipoTransaccion" value="1"
                                            (change)="seleccionBusqueda(false)">
                                        <span>Cuenta</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-9 text-center">
                            <form autocomplete="off" id="form" [formGroup]="formBusqueda">
                                <div class="row fila-busqueda">

                                    <!-- COLUMNA CAMPOS -->
                                    <div class="col-md-6">

                                        <!-- BUSQUEDA POR TRANSACCIÓN -->
                                        <ng-container *ngIf="vbleBusqTransa">
                                            <input type="text" class="form-control" tooltip="Transacción"
                                                id="SelectBuscar" placement="top" formControlName="transaccion"
                                                maxlength="20" placeholder="Transacción" appSoloNumero
                                                (keyup.enter)="generarImpresion1()" />
                                        </ng-container>

                                        <!-- BUSQUEDA POR CUENTA -->
                                        <ng-container *ngIf="!vbleBusqTransa">
                                            <div class="fila-busqueda cuentas">
                                                <input type="text" class="form-control cuenta-corta" maxlength="3"
                                                    formControlName="oficinaI" appSoloNumero placeholder="000" />

                                                <input type="text" class="form-control cuenta-corta" maxlength="3"
                                                    formControlName="producto" appSoloNumero placeholder="000" />

                                                <input type="text" class="form-control cuenta-larga" maxlength="7"
                                                    formControlName="consecutivo" appSoloNumero placeholder="0000000" />

                                                <input type="text" class="form-control cuenta-corta" maxlength="1"
                                                    formControlName="digito" appSoloNumero placeholder="0"
                                                    (keyup.enter)="generarImpresion1()" />
                                            </div>
                                        </ng-container>

                                    </div>

                                    <!-- COLUMNA SELECT -->
                                    <div class="col-md-3">
                                        <select class="form-control campo-documento" formControlName="libro">
                                            <option value="1">COLGAAP</option>
                                            <option value="2">NIIF</option>
                                        </select>
                                    </div>

                                    <!-- COLUMNA BOTÓN -->
                                    <div class="col-md-1 d-flex align-items-center">
                                        <button type="button" class="btn Gt-btn-verde btn-icon btn-buscar"
                                            (click)="generarImpresion1()">
                                            <i class="glyphicon glyphicon-search"></i>
                                        </button>
                                    </div>
                                    <!-- COLUMNA BOTÓN -->
                                    <div class="col-md-1 d-flex align-items-center">
                                        <button type="button" class="btn Gt-btn-verde btn-icon btn-buscar"
                                            [disabled]="!enableDescTransa" (click)="descargarPdf()">
                                            <i class="icon-download4"></i>
                                            &nbsp;PDF
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="panel panel-white">
    <div class="panel-heading pad5">
        <div class="pdf-container">
            <iframe id="ImpresionTransaccion" width="100%" height="700px" style="border: none;">
            </iframe>
        </div>
    </div>
</div>
