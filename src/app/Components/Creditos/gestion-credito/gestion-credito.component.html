<div class="panel mb-0">
    <div class="panel-heading green">
        <div class="rail">
            <div class="node">
                <button class="step-btn" [class.active]="activeTab === 'inicio'" (click)="changeTab('inicio')">
                    <div class="bubble" title="Inicio">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M3 11l9-8 9 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                stroke-linejoin="round"></path>
                            <path d="M5 10v10h14V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                stroke-linejoin="round"></path>
                        </svg>
                    </div>
                    <span class="step-label">Inicio</span>
                </button>
            </div>
            <div class="connector"></div>

            <div class="node">
                <button class="step-btn" [class.active]="activeTab === 'asesoria'" (click)="changeTab('asesoria')">
                    <div class="bubble">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round"></path>
                            <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"></circle>
                        </svg>
                    </div>
                    <span class="step-label">Asesoría</span>
                </button>
            </div>
            <div class="connector"></div>

            <div class="node">
                <button class="step-btn" [class.active]="activeTab === 'radicacion'" (click)="changeTab('radicacion')">
                    <div class="bubble">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M6 3h9l4 4v14H6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                            </path>
                            <path d="M15 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
                            <path d="M9 12h6M9 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                            </path>
                        </svg>
                    </div>
                    <span class="step-label">Radicación</span>
                    <!-- <span class="step-caption">Ver radicados</span> -->
                </button>
            </div>
            <div class="connector"></div>

            <div class="node">
                <button class="step-btn" [class.active]="activeTab === 'aprobacion'" (click)="changeTab('aprobacion')" disabled>
                    <div class="bubble">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"></path>
                        </svg>
                    </div>
                    <span class="step-label">Aprobación</span>
                    <!-- <span class="step-caption">Ver aprobados</span> -->
                </button>
            </div>
            <div class="connector"></div>

            <div class="node">
                <button class="step-btn" [class.active]="activeTab === 'desembolso'" (click)="changeTab('desembolso')" disabled>
                    <div class="bubble">
                        <svg viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="7" width="18" height="12" rx="1.6" stroke="currentColor" stroke-width="1.8">
                            </rect>
                            <path d="M3 10h18" stroke="currentColor" stroke-width="1.8"></path>
                            <circle cx="16.5" cy="14.3" r="1.3" fill="currentColor"></circle>
                        </svg>
                    </div>
                    <span class="step-label">Desembolso</span>
                    <!-- <span class="step-caption">Ver desembolsados</span> -->
                </button>
            </div>
        </div>
    </div>
    <!-- <div class="panel-body">

    </div> -->
</div>

<div>
    @switch(activeTab) {
            @case ('inicio') {
                <app-inicio />
            }

            @case ('asesoria') {
                <app-asesoria />
            }

            @case ('radicacion') {
                <app-radicacion />
            }

            @case ('aprobacion') {
                <div class="panel">
                    <h1>Aprobación</h1>
                </div>
            }

            @case ('desembolso') {
                <div class="panel">
                    <h1>Desembolso</h1>
                </div>
            }

            @default {
                <p>No encontrado</p>
            }
        }
</div>
